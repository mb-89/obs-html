# Deletes obs-html's spent branches (README "Branch cleanup"). Cloud sessions cannot delete a ref
# themselves (HTTP 403), so branches go only through this workflow, with the run's token. The
# commits stay reachable through the closed pull requests.
#
# Owned here: copied once from se's branch-cleanup.yml and grown by the run by hand, so it is not one
# of the copies se_workflows.py writes (that is why it is not named branch-cleanup.yml).
#
# On a pull request's close, merged or not, it deletes that pull request's head branch, only where
#   - the head repository is this repository, never a fork;
#   - the branch is neither `main` nor the default branch, and starts with neither `ccr-` nor
#     `claude/` (a cloud session's own branch);
#   - no other open pull request has it as its head;
#   - it still points at the pull request's head sha (the lease).
#
# Run by hand (Actions, clean-branches, Run workflow), it walks every branch of the repository and
# deletes each one where
#   - the same protected names as above do not hold it;
#   - it heads no open pull request, and at least one closed pull request of this repository;
#   - it still points at the head sha of the newest of those closed pull requests;
#   - that pull request names its work issue (`Refs`, `Closes` or `Fixes`, then `#<n>` or the
#     issue's URL; a landing's `Lands #<n>` is followed to its work pull request's description),
#     and every work issue it names is closed.
# With `dry_run` it deletes nothing and lists what it would delete.
#
# Each outcome is one line of the run's summary; a guard that holds keeps the branch and says why,
# and the run ends green.
name: clean-branches

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, and delete nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  clean:
    runs-on: ubuntu-26.04
    steps:
      - name: Delete spent branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: python3 {0}
        run: |
          # GitHub's REST API is the one door; every outcome is one line of the run's summary.
          import json, os, re, sys, urllib.error, urllib.parse, urllib.request

          PROTECTED = {"main"}
          PREFIXES = ("ccr-", "claude/")
          PAGE = 100

          def api(method, path):
              """(status, JSON body or None) of one REST call; a 404 or 422 is an answer, not an error."""
              request = urllib.request.Request(
                  os.environ.get("GITHUB_API_URL", "https://api.github.com") + path, method=method,
                  headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                           "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(request) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if error.code in (404, 422):
                      return error.code, None
                  raise

          def say(line):
              print(line)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as out:
                      out.write(line + "\n")

          repository = os.environ["GITHUB_REPOSITORY"]
          owner = repository.split("/")[0]

          def ref(branch):
              return urllib.parse.quote(f"heads/{branch}", safe="/")

          def protected(branch, default):
              return branch in PROTECTED | {default} or branch.startswith(PREFIXES)

          def default_branch():
              _, about = api("GET", f"/repos/{repository}")
              return (about or {}).get("default_branch", "main")

          def pulls_of(branch, state):
              query = urllib.parse.urlencode({"state": state, "head": f"{owner}:{branch}", "per_page": PAGE})
              _, found = api("GET", f"/repos/{repository}/pulls?{query}")
              return [pull for pull in found or []
                      if ((pull.get("head") or {}).get("repo") or {}).get("full_name", "").lower()
                      == repository.lower()]

          REFERENCE = re.compile(
              rf"\b(refs|closes|fixes|lands)\s+(?:#(\d+)|https://github\.com/{re.escape(repository)}"
              rf"/(?:issues|pull)/(\d+))\b", re.IGNORECASE)

          def work_issues(body, follow=True):
              """The work issues a pull request's description names, in order, as {number: state}; a
              `Lands` reference is followed once to the work pull request it names."""
              found = {}
              for match in REFERENCE.finditer(body or ""):
                  keyword, number = match[1].lower(), int(match[2] or match[3])
                  if keyword == "lands":
                      if follow:
                          _, landed = api("GET", f"/repos/{repository}/pulls/{number}")
                          named = work_issues((landed or {}).get("body"), follow=False)
                      else:
                          named = {}
                  elif number in found:
                      named = {}
                  else:
                      _, issue = api("GET", f"/repos/{repository}/issues/{number}")
                      named = {number: issue.get("state")} if issue and "pull_request" not in issue else {}
                  found.update((n, state) for n, state in named.items() if n not in found)
              return found

          def on_close():
              number, branch = os.environ["NUMBER"], os.environ["HEAD_REF"]
              sha, head = os.environ["HEAD_SHA"], os.environ["HEAD_REPOSITORY"]
              if head.lower() != repository.lower():
                  return say(f"Branch cleanup: kept {branch} of #{number}: its head repository "
                             f"{head or '(deleted)'} is not {repository}.")
              if protected(branch, default_branch()):
                  return say(f"Branch cleanup: kept {branch} of #{number}: it is a protected branch.")
              others = sorted(pull["number"] for pull in pulls_of(branch, "open") if str(pull["number"]) != number)
              if others:
                  return say(f"Branch cleanup: kept {branch} of #{number}: it is the head of the open pull "
                             "request " + ", ".join(f"#{n}" for n in others) + ".")
              status, found = api("GET", f"/repos/{repository}/git/ref/{ref(branch)}")
              if status == 404:
                  return say(f"Branch cleanup: {branch} of #{number} is already gone.")
              tip = (found or {}).get("object", {}).get("sha", "")
              if tip != sha:
                  return say(f"Branch cleanup: kept {branch} of #{number}: it moved to {tip[:12]} since the "
                             f"pull request's head {sha[:12]}.")
              status, _ = api("DELETE", f"/repos/{repository}/git/refs/{ref(branch)}")
              if status == 422:
                  return say(f"Branch cleanup: {branch} of #{number} is already gone.")
              say(f"Branch cleanup: deleted {branch} of #{number} at {sha[:12]}.")

          def branches():
              page, found = 1, []
              while True:
                  _, chunk = api("GET", f"/repos/{repository}/branches?per_page={PAGE}&page={page}")
                  found += chunk or []
                  if not chunk:
                      return found
                  page += 1

          def judge(branch, tip, default):
              """(the closed pull request that spent the branch, None) or (None, why it is kept)."""
              if protected(branch, default):
                  return None, "it is a protected branch"
              pulls = pulls_of(branch, "all")
              still = sorted(pull["number"] for pull in pulls if pull["state"] == "open")
              if still:
                  return None, "it is the head of the open pull request " + ", ".join(f"#{n}" for n in still)
              spent = sorted((pull for pull in pulls if pull["state"] == "closed"), key=lambda pull: pull["number"])
              if not spent:
                  return None, "it has no closed pull request from this repository"
              newest = spent[-1]
              if newest["head"]["sha"] != tip:
                  return None, f"it moved to {tip[:12]} since the head {newest['head']['sha'][:12]} of #{newest['number']}"
              issues = work_issues(newest.get("body"))
              if not issues:
                  return None, f"#{newest['number']} names no work issue"
              for number, state in issues.items():
                  if state != "closed":
                      return None, f"its work issue #{number} of #{newest['number']} is open"
              return (newest, list(issues)), None

          def by_hand():
              dry = os.environ.get("DRY_RUN", "").lower() == "true"
              default = default_branch()
              deleted, kept = [], []
              for item in branches():
                  branch, tip = item["name"], item["commit"]["sha"]
                  spent, why = judge(branch, tip, default)
                  if why:
                      kept.append(f"- kept {branch}: {why}")
                      continue
                  pull, issues = spent
                  named = ("its work issue " if len(issues) == 1 else "its work issues ") + ", ".join(
                      f"#{n}" for n in issues) + (" is closed" if len(issues) == 1 else " are closed")
                  if not dry:
                      status, _ = api("DELETE", f"/repos/{repository}/git/refs/{ref(branch)}")
                      if status == 422:
                          kept.append(f"- kept {branch}: it was already gone")
                          continue
                  verb = "would delete" if dry else "deleted"
                  deleted.append(f"- {verb} {branch} of #{pull['number']} at {tip[:12]}: {named}")
              count = len(deleted)
              noun = "branch" if count == 1 else "branches"
              head = (f"Branch cleanup by hand, dry run: would delete {count} {noun}" if dry
                      else f"Branch cleanup by hand: deleted {count} {noun}")
              say(f"{head}, kept {len(kept)}.")
              say("")
              for line in deleted + kept:
                  say(line)

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              by_hand()
          else:
              on_close()
